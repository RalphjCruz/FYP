services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - myslime-network

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/myslime
    depends_on:
      - db
    networks:
      - myslime-network

  db:
    image: postgres:13
    container_name: myslime-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myslime
    ports:
      - "5432:5432"
    networks:
      - myslime-network

networks:
  myslime-network:
    driver: bridge
