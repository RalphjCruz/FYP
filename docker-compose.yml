services:
  frontend:
    build: ./frontend
    container_name: myslime-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - myslime-network

  backend:
    build: ./backend
    container_name: myslime-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@db:5432/myslime
    depends_on:
      - db
    networks:
      - myslime-network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  db:
    image: postgres:13
    container_name: myslime-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myslime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - myslime-network

networks:
  myslime-network:
    driver: bridge

volumes:
  postgres-data: