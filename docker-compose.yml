services:
  frontend:
    build: ./frontend
    container_name: myslime-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - myslime-network

  backend:
    build: ./backend
    container_name: myslime-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@db:5432/myslime
    depends_on:
      - db
    networks:
      - myslime-network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  camera-monitor:
    build: ./tools/camera-monitor
    container_name: myslime-camera-monitor
    ports:
      - "8001:8001"
    environment:
      - CAMERA_MONITOR_CORS_ORIGINS=${CAMERA_MONITOR_CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      - CAMERA_MONITOR_CORS_ORIGIN_REGEX=${CAMERA_MONITOR_CORS_ORIGIN_REGEX:-}
    networks:
      - myslime-network

  db:
    image: postgres:13
    container_name: myslime-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myslime
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - myslime-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: myslime-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@myslime.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - myslime-network

networks:
  myslime-network:
    driver: bridge

volumes:
  postgres-data:
