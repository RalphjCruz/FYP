name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Clean npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: |
        npm install --verbose
        chmod -R 755 node_modules/.bin  # Ensure executables have the right permissions

    - name: Run tests
      run: npm test
